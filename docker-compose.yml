services:
  website:
    build: .
    ports:
      - "9500:9500"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "9500"
      HOST: "0.0.0.0"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
